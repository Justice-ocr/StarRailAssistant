name: Build StarRailAssistant

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore frontend
        run: dotnet restore .\SRAFrontend\SRAFrontend.sln

      - name: Publish frontend
        run: dotnet publish -c Release -r win-x64 .\SRAFrontend\SRAFrontend.sln

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q SRACore tasks main.py

      - name: Build packages
        run: python scripts/package.py

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Path "version_info.txt" -TotalCount 1).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          Expand-Archive -Path "StarRailAssistant_${{ steps.version.outputs.version }}.zip" -DestinationPath StarRailAssistant
          Copy-Item version_info.txt -Destination setup\install_info.txt -Force
          New-Item -ItemType Directory -Path setup\SRA -Force | Out-Null
          Copy-Item -Path StarRailAssistant\* -Destination setup\SRA -Force -Recurse
          New-Item -ItemType Directory -Path setup\output -Force | Out-Null
          python setup/version_modifier.py --version "${{ steps.version.outputs.version }}"
          iscc setup\srasetup.iss
          Copy-Item -Path setup\output\* -Destination . -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            StarRailAssistant_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Core_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Lite_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Full_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_ServerDLC_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_DesktopDLC_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_${{ steps.version.outputs.version }}_Setup.exe
            version_info.txt

  publish_release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(head -n 1 artifacts/version_info.txt | sed 's/\r$//')"
          {
            echo "version=$version"
            echo "notes<<EOF"
            tail -n +3 artifacts/version_info.txt | sed 's/\r$//'
            echo
            echo "Download notes:"
            echo "- StarRailAssistant_Core*.zip - core package without GUI; manual config is required"
            echo "- StarRailAssistant_Lite*.zip - lightweight package; core package is required separately"
            echo "- StarRailAssistant_vX.X.X.zip - basic portable package"
            echo "- StarRailAssistant_Full*.zip - full portable package with desktop and server DLC"
            echo "- StarRailAssistant_ServerDLC*.zip - server DLC only"
            echo "- StarRailAssistant_DesktopDLC*.zip - desktop DLC only"
            echo "- StarRailAssistant_vX.X.X_Setup.exe - installer"
            echo
            echo "Packages except the core package require .NET Desktop Runtime 10.0."
            echo
            echo '```This release was built automatically by GitHub Actions.```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          body: ${{ steps.metadata.outputs.notes }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true' || contains(steps.metadata.outputs.version, '-') }}
          make_latest: ${{ contains(steps.metadata.outputs.version, '-') && 'false' || 'true' }}
          files: |
            artifacts/StarRailAssistant_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_Core_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_Lite_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_Full_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_ServerDLC_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_DesktopDLC_${{ steps.metadata.outputs.version }}.zip
            artifacts/StarRailAssistant_${{ steps.metadata.outputs.version }}_Setup.exe
