name: Build StarRailAssistant

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as prerelease
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install WebUI dependencies
        working-directory: SRAFrontend/srafrontend-webui
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        working-directory: SRAFrontend/srafrontend-webui
        run: pnpm build

      - name: Install .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET projects
        run: dotnet restore .\SRAFrontend\SRAFrontend.sln

      - name: Build .NET projects
        run: dotnet build .\SRAFrontend\SRAFrontend.sln --no-restore --nologo

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nuitka
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q SRACore tasks main.py

      - name: Run Python tests
        run: python -m pytest -q

      - name: Build packages
        run: python scripts/package.py

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Path "version_info.txt" -TotalCount 1).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          Expand-Archive -Path "StarRailAssistant_${{ steps.version.outputs.version }}.zip" -DestinationPath StarRailAssistant
          Copy-Item version_info.txt -Destination setup\install_info.txt -Force
          New-Item -ItemType Directory -Path setup\SRA -Force | Out-Null
          Copy-Item -Path StarRailAssistant\* -Destination setup\SRA -Force -Recurse
          New-Item -ItemType Directory -Path setup\output -Force | Out-Null
          python setup/version_modifier.py --version "${{ steps.version.outputs.version }}"
          iscc setup\srasetup.iss
          Copy-Item -Path setup\output\* -Destination . -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            StarRailAssistant_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Core_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Lite_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Full_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_ServerDLC_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_DesktopDLC_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_WebUI_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_Resources_${{ steps.version.outputs.version }}.zip
            StarRailAssistant_${{ steps.version.outputs.version }}_Setup.exe
            version_info.txt

  publish_release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(head -n 1 artifacts/version_info.txt | sed 's/\r$//')"
          {
            echo "version=$version"
            echo "notes<<EOF"
            tail -n +3 artifacts/version_info.txt | sed 's/\r$//'
            echo
            echo '```This release was built automatically by GitHub Actions.```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          body: ${{ steps.metadata.outputs.notes }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true' || contains(steps.metadata.outputs.version, '-') }}
          make_latest: ${{ contains(steps.metadata.outputs.version, '-') && 'false' || 'true' }}
          files: artifacts/*
